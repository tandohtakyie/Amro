[versions]
#   Build toolchain
agp                      = "9.0.1"
kotlin                   = "2.3.20"
ksp                      = "2.3.6"

#   AndroidX core
coreKtx                  = "1.18.0"
lifecycleRuntimeKtx      = "2.10.0"
activityCompose          = "1.13.0"
composeBom               = "2026.03.01"
navigationCompose        = "2.9.7"

#   Dependency injection
hilt                     = "2.59.2"
hiltNavigationCompose    = "1.3.0"

#   Networking
retrofit                 = "3.0.0"
okhttp                   = "5.3.2"
kotlinxSerializationJson = "1.11.0"

#   Database
room                     = "2.8.4"

#   Offline-first
store5                   = "5.1.0-alpha08"

#   Image loading
coil                     = "3.4.0"

#   Async
kotlinxCoroutines        = "1.10.2"

#   Background work
workmanager              = "2.11.2"

#   Testing
junit                    = "4.13.2"
junitVersion             = "1.3.0"
espressoCore             = "3.7.0"
mockk                    = "1.14.9"
turbine                  = "1.2.1"
robolectric              = "4.16.1"
roborazzi                = "1.59.0"

#   Coverage
jacoco                   = "0.8.12"

[libraries]
#   AndroidX core
androidx-core-ktx                    = { group = "androidx.core",      name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",  name = "activity-compose",            version.ref = "activityCompose" }
androidx-splashscreen                = { group = "androidx.core",      name = "core-splashscreen",           version = "1.2.0" }

#   Compose BOM + UI
androidx-compose-bom              = { group = "androidx.compose",          name = "compose-bom",            version.ref = "composeBom" }
androidx-compose-ui               = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics      = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling       = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-compose-material3        = { group = "androidx.compose.material3", name = "material3" }

#   Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

#   Hilt
hilt-android                     = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-android-compiler            = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-android-testing             = { group = "com.google.dagger", name = "hilt-android-testing",   version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work               = { group = "androidx.hilt",     name = "hilt-work",              version = "1.3.0" }

#   Networking — retrofit-kotlinx-serialization uses Retrofit 3's built-in converter
retrofit                       = { group = "com.squareup.retrofit2", name = "retrofit",                         version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization",  version.ref = "retrofit" }
okhttp                         = { group = "com.squareup.okhttp3",   name = "okhttp",                           version.ref = "okhttp" }
okhttp-logging-interceptor     = { group = "com.squareup.okhttp3",   name = "logging-interceptor",              version.ref = "okhttp" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json",       version.ref = "kotlinxSerializationJson" }

#   Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }
room-testing  = { group = "androidx.room", name = "room-testing",   version.ref = "room" }

#   Offline-first
store5 = { group = "org.mobilenativefoundation.store", name = "store5", version.ref = "store5" }

#   Image loading
coil-compose        = { group = "io.coil-kt.coil3", name = "coil-compose",        version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

#   Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "kotlinxCoroutines" }

#   Background work
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

#   Testing
junit                  = { group = "junit",                  name = "junit",          version.ref = "junit" }
androidx-junit         = { group = "androidx.test.ext",      name = "junit",          version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core",  version.ref = "espressoCore" }
mockk                  = { group = "io.mockk",               name = "mockk",          version.ref = "mockk" }
mockk-android          = { group = "io.mockk",               name = "mockk-android",  version.ref = "mockk" }
turbine                = { group = "app.cash.turbine",        name = "turbine",        version.ref = "turbine" }
robolectric            = { group = "org.robolectric",         name = "robolectric",    version.ref = "robolectric" }
roborazzi-core         = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                version.ref = "roborazzi" }
roborazzi-compose      = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",        version.ref = "roborazzi" }
roborazzi-rule         = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",     version.ref = "roborazzi" }

#   Build-logic artifacts (used inside build-logic/convention)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle",                                version.ref = "agp" }
kotlin-gradlePlugin  = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin",                 version.ref = "kotlin" }
ksp-gradlePlugin     = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin    = { group = "androidx.room",            name = "room-gradle-plugin",                   version.ref = "room" }

[plugins]
#   Standard
android-application  = { id = "com.android.application",                   version.ref = "agp" }
android-library      = { id = "com.android.library",                       version.ref = "agp" }
# kotlin-android is omitted — AGP 9.0+ includes Kotlin support natively
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
room                 = { id = "androidx.room",                             version.ref = "room" }
roborazzi            = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }

#   Convention plugins — activated in a future phase via includeBuild
# amro-android-application = { id = "amro.android.application", version = "unspecified" }
# amro-android-library     = { id = "amro.android.library",     version = "unspecified" }
# amro-android-feature     = { id = "amro.android.feature",     version = "unspecified" }
# amro-android-hilt        = { id = "amro.android.hilt",        version = "unspecified" }
# amro-android-room        = { id = "amro.android.room",        version = "unspecified" }

[bundles]
compose          = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview", "androidx-compose-material3"]
compose-debug    = ["androidx-compose-ui-tooling", "androidx-compose-ui-test-manifest"]
retrofit         = ["retrofit", "retrofit-kotlinx-serialization", "okhttp-logging-interceptor"]
room             = ["room-runtime", "room-ktx"]
testing-unit     = ["junit", "mockk", "turbine", "kotlinx-coroutines-test"]
testing-snapshot = ["roborazzi-core", "roborazzi-compose", "roborazzi-rule", "robolectric"]
